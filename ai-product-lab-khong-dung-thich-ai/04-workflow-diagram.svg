<svg viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1100" height="460" fill="#ffffff"/>
  <text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Current-State Workflow — Xanh SM Xu ly bao pin nguy cap</text>

  <!-- Step 1 -->
  <rect x="20" y="90" width="170" height="110" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="105" y="115" text-anchor="middle" font-size="13" font-weight="bold">1. Tai xe bao pin</text>
  <text x="105" y="133" text-anchor="middle" font-size="12">Goi/nhan tin qua app</text>
  <text x="105" y="151" text-anchor="middle" font-size="12">hoac hotline</text>
  <text x="105" y="175" text-anchor="middle" font-size="12" fill="#555">~1 phut</text>

  <path d="M190 145 L225 145" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207" y="135" text-anchor="middle" font-size="11" fill="#c0392b">🔄</text>

  <!-- Step 2 (bottleneck) -->
  <rect x="225" y="80" width="190" height="130" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="3"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">🔴 2. Tra he thong</text>
  <text x="320" y="118" text-anchor="middle" font-size="12">tram sac (he thong</text>
  <text x="320" y="136" text-anchor="middle" font-size="12">rieng, tach biet)</text>
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="#555">Bottleneck: thu cong,</text>
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#555">de sai khoang cach</text>
  <text x="320" y="195" text-anchor="middle" font-size="12" fill="#c0392b">⏱ ~3-5 phut</text>

  <path d="M415 145 L450 145" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 (bottleneck + handoff) -->
  <rect x="450" y="80" width="190" height="130" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="3"/>
  <text x="545" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">🔴🔄 3. Quyet dinh</text>
  <text x="545" y="118" text-anchor="middle" font-size="12">tram sac hay dieu</text>
  <text x="545" y="136" text-anchor="middle" font-size="12">xe sac di dong</text>
  <text x="545" y="158" text-anchor="middle" font-size="11" fill="#555">Bottleneck: tinh tay,</text>
  <text x="545" y="174" text-anchor="middle" font-size="11" fill="#555">phu thuoc kinh nghiem</text>
  <text x="545" y="195" text-anchor="middle" font-size="12" fill="#c0392b">⏱ ~2-3 phut</text>

  <path d="M640 145 L675 145" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="675" y="90" width="180" height="110" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="765" y="115" text-anchor="middle" font-size="13" font-weight="bold">4. Soan &amp; gui tin</text>
  <text x="765" y="133" text-anchor="middle" font-size="12">nhan cho tai xe</text>
  <text x="765" y="151" text-anchor="middle" font-size="12">(thu cong)</text>
  <text x="765" y="175" text-anchor="middle" font-size="12" fill="#555">~1-2 phut</text>

  <path d="M765 200 L765 235 L850 235" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="228" text-anchor="middle" font-size="11" fill="#c0392b">🔄 (neu can dieu xe sac)</text>

  <!-- Step 5 (handoff) -->
  <rect x="850" y="260" width="200" height="120" rx="10" fill="#fff4e5" stroke="#e67e22" stroke-width="2"/>
  <text x="950" y="285" text-anchor="middle" font-size="13" font-weight="bold">🔄 5. Goi doi logistics</text>
  <text x="950" y="303" text-anchor="middle" font-size="12">xac nhan dieu xe sac</text>
  <text x="950" y="321" text-anchor="middle" font-size="12">di dong (he thong khac)</text>
  <text x="950" y="345" text-anchor="middle" font-size="12" fill="#555">⏱ ~5-10 phut</text>

  <!-- Total -->
  <rect x="20" y="400" width="1030" height="45" rx="8" fill="#f1f3f4" stroke="#999"/>
  <text x="535" y="428" text-anchor="middle" font-size="14" font-weight="bold">Tong cong quy trinh (case can dieu xe sac di dong): ~12-20 phut/luot</text>

  <!-- Legend -->
  <rect x="20" y="240" width="18" height="18" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="45" y="254" font-size="12">🔴 Bottleneck</text>
  <rect x="150" y="240" width="18" height="18" fill="#fff4e5" stroke="#e67e22" stroke-width="2"/>
  <text x="175" y="254" font-size="12">🔄 Handoff giua nguoi-nguoi / nguoi-he thong</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
